<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTONIO CERINI — Portfolio</title>
    
    <!-- Importazione Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* ... [tutto il tuo CSS precedente fino a .projects-carousel-track] ... */
        
        .projects-carousel-track {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            padding: 10px 0;
            scrollbar-width: none; 
            -ms-overflow-style: none; 
        }

        .projects-carousel-track::-webkit-scrollbar {
            display: none; 
        }

        .projects-carousel-track .card-project {
            flex: 0 0 100%; 
            scroll-snap-align: center;
            min-width: 0;
            min-height: 400px;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 2rem;
        }

        .projects-carousel-track .card-project .card-meta {
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
            width: 100%;
        }

        .projects-carousel-track .card-project h3 { 
            font-size: 2.5rem; 
            margin-bottom: 1rem;
        }

        .projects-carousel-track .card-project .spec {
            font-size: 1.3rem;
            margin-bottom: 2rem;
        }
        
        /* ECCO LA RIGA CORRETTA DOVE SI ERA INTERROTTO IL CODICE */
        .projects-carousel-track .card-project .studio { 
            border-top: none;
        }
    </style>
</head>

</html>
