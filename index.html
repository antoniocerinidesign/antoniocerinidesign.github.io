<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antonio Cerini — Product Designer</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --text-color: #f5f5f5;
      --accent-color: #888888;
      --border-color: #222222;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 3rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
    }

    /* Styling del logo CA (senza la scritta Product Designer) */
    .logo {
      display: inline-block;
      text-decoration: none;
    }

    .logo img {
      height: 48px;
      width: auto;
      display: block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .logo img:hover {
      opacity: 0.8;
      transform: scale(1.02);
    }

    nav a {
      color: var(--accent-color);
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.95rem;
      font-weight: 400;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--text-color);
    }

    main.hero {
      margin-top: 6rem;
      max-width: 800px;
    }

    main.hero h1 {
      font-size: 3.5rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }

    main.hero p {
      color: var(--accent-color);
      font-size: 1.25rem;
      line-height: 1.6;
      font-weight: 300;
    }
  </style>
</head>
<body>

  <header>
    <!-- Logo Monogramma CA incorporato -->
    <a href="/" class="logo" aria-label="Home">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSU64AAA..." alt="Antonio Cerini Logo">
    </a>

    <nav>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <h1>Antonio Cerini</h1>
    <p>Product Designer focalizzato sull'architettura visiva, esperienziale e sullo sviluppo di prodotti digitali contemporanei.</p>
  </main>

</body>
</html>
