<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTONIO CERINI — Portfolio</title>
    
    <!-- Importazione Font Libre Baskerville da Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #F4F2ED;            
            --card-bg: #FFFFFF;       
            --text-main: #121212;     
            --text-muted: #666460;    
            --border: #DCD8CF;        
            --accent-red: #D9381E;    
            
            --font-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-serif: 'Libre Baskerville', Georgia, serif;
            --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Barra Superiore Architetturale */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .top-bar-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-red);
            border-radius: 50%;
        }

        /* Hero / Header Section */
        header {
            padding: 4rem 2rem 4rem 2rem;
            border-bottom: 1px solid var(--border);
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Container Logo Centrato in Cima con Offset a Sinistra per Allineamento Ottico */
        .top-logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 3rem;
            transform: translateX(-40px); /* Spostamento ottico a sinistra per centrare C e A con PORTFOLIO / 2026 */
        }

        .header-logo {
            display: inline-block;
            text-decoration: none;
        }

        .header-logo img {
            height: 220px;
            width: auto;
            max-width: 100%;
            display: block;
            object-fit: contain;
        }
        
        .header-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
            align-items: start;
        }

        /* Adattamento per Cellulari e Tablet piccoli */
        @media (max-width: 768px) {
            .header-grid { 
                grid-template-columns: 1fr; 
                gap: 2.5rem;
            }

            .top-logo-container {
                margin-bottom: 2rem;
                transform: translateX(0); /* Su schermi piccoli torna al centro perfetto */
            }

            .header-logo img {
                height: 160px; 
            }
        }

        .meta-label {
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-red);
            font-weight: 600;
            margin-bottom: 1rem;
            display: block;
        }

        h1 { 
            font-family: var(--font-display);
            font-size: clamp(3rem, 7vw, 5.5rem); 
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }
        
        .subtitle { 
            font-family: var(--font-serif);
            font-size: clamp(1.6rem, 3vw, 2.2rem); 
            font-style: italic;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .experience-list {
            font-family: var(--font-display);
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            color: var(--text-muted);
            line-height: 1.8;
            border-left: 2px solid var(--border);
            padding-left: 1.25rem;
        }

        .about-quote {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            line-height: 1.4;
            font-style: italic;
            color: var(--text-main);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent-red);
            padding: 2rem;
            border-radius: 2px;
        }

        .contacts-bar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .contact-btn {
            font-family: var(--font-display);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-main);
            text-decoration: none;
            background: var(--card-bg);
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .contact-btn:hover {
            background: var(--accent-red);
            color: #FFFFFF;
            border-color: var(--accent-red);
        }
        
        /* Main Layout Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }
        
        section {
            margin-bottom: 5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 2.5rem;
        }

        h2 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .section-num {
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-red);
        }

        /* Progetti Grid in Stile Editoriale */
        .grid-projects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        
        .card-project {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        
        .card-project:hover { 
            border-color: var(--accent-red);
            transform: translateY(-3px);
        }
        
        .card-project .card-meta {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .card-project .card-meta span:first-child {
            color: var(--accent-red);
            font-weight: 600;
        }

        .card-project h3 { 
            font-family: var(--font-display);
            font-size: 1.5rem; 
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .card-project .spec {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-style: italic;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        
        .card-project .studio { 
            font-family: var(--font-display);
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-main);
            border-top: 1px solid var(--border);
            padding-top: 1rem;
            margin-top: auto;
        }

        /* Riconoscimenti e Formazione */
        .award-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1.5rem;
            align-items: center;
        }

        .award-icon {
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.5rem 0.75rem;
