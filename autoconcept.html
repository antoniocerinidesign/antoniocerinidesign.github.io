<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 — AUTO CONCEPT | Antonio Cerini</title>
    <!-- Google Fonts import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET E VARIABILI --- */
        :root {
            --bg-color: #0A0A0A;
            --surface-color: #121212;
            --border-dark: #262626;
            --border-subtle: #1f1f1f;
            --text-primary: #EDEDED;
            --text-muted: #888888;
            --font-display: 'Cinzel', serif;
            --font-body: 'Inter', sans-serif;
            --max-width: 1200px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            padding-bottom: 5rem;
        }

        /* --- HEADER & NAVIGAZIONE --- */
        .header {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 2.5rem 1.5rem 1.5rem;
            display: flex;
            align-items: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .back-link:hover {
            color: #FFFFFF;
            transform: translateX(-3px);
        }

        /* --- LAYOUT PRINCIPALE --- */
        main {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* --- HERO IMAGE CONTAINER --- */
        .hero-image-wrapper {
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .hero-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            cursor: zoom-in;
            transition: opacity 0.3s ease;
        }

        .hero-image-wrapper img:hover {
            opacity: 0.92;
        }

        /* --- GRID INFO PROGETTO E SKETCH --- */
        .project-content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-bottom: 3.5rem;
        }

        @media (min-width: 850px) {
            .project-content-grid {
                grid-template-columns: 1.1fr 0.9fr;
                gap: 3.5rem;
            }
        }

        /* Testi Progetto */
        .text-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .project-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 600;
            letter-spacing: 0.05em;
            line-height: 1.2;
            color: #FFFFFF;
        }

        .project-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 1rem;
        }

        .project-description {
            font-size: 0.95rem;
            color: #CCCCCC;
            font-weight: 300;
            line-height: 1.8;
            text-align: justify;
        }

        /* Container Immagine Sketch */
        .sketch-wrapper {
            background-color: var(--surface-color);
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sketch-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            cursor: zoom-in;
            transition: opacity 0.3s ease;
        }

        .sketch-wrapper img:hover {
            opacity: 0.92;
        }

        /* --- SEZIONI GENERALI --- */
        .section-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #FFFFFF;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 1rem;
        }

        /* --- CONCEPT ART GRID --- */
        .concept-art-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        @media (min-width: 600px) {
            .concept-art-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .concept-art-item {
            background-color: var(--surface-color);
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
        }

        .concept-art-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .concept-art-item img:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        /* --- RENDERS CAROUSEL SECTION --- */
        .renders-carousel-section {
            margin-bottom: 4rem;
        }

        .carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 1rem;
        }

        .carousel-title {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #FFFFFF;
        }

        /* Slide Unica */
        .single-slide-wrapper {
            position: relative;
            background-color: var(--surface-color);
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            width: 100%;
        }

        .single-slide-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
            transition: opacity 0.3s ease;
        }

        .single-slide-wrapper img:hover {
            opacity: 0.95;
        }

        /* Indicatori (Puntini) */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 1.25rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--border-dark);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .dot.active {
            background-color: #FFFFFF;
            transform: scale(1.2);
        }

        /* --- LIGHTBOX (ZOOM MODALE) --- */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 2rem;
            cursor: zoom-out;
        }

        .lightbox-content {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            cursor: default;
        }

        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            color: #FFFFFF;
            font-size: 2.5rem;
            font-weight: 300;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease, transform 0.2s ease;
            z-index: 10002;
            line-height: 1;
        }

        .lightbox-close:hover {
            color: #888888;
            transform: scale(1.1);
        }

        /* FRECCE NAVIGAZIONE LIGHTBOX (A DESTRA E SINISTRA) */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: #FFFFFF;
            color: #111111;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease, color 0.2s ease;
            user-select: none;
            z-index: 10002;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .lightbox-nav:hover {
            background-color: #E0E0E0;
            transform: translateY(-50%) scale(1.08);
        }

        .lightbox-prev {
            left: 2rem;
        }

        .lightbox-next {
            right: 2rem;
        }

        @media (max-width: 600px) {
            .lightbox-nav {
                width: 42px;
                height: 42px;
                font-size: 1.1rem;
            }
            .lightbox-prev { left: 0.8rem; }
            .lightbox-next { right: 0.8rem; }
        }
    </style>
</head>
<body>
